name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build Windows portable and Linux unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win portable dir --x64 \
            -c.win.signAndEditExecutable=false --publish never
          npx electron-builder --linux dir --x64 --publish never

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT=release-assets
          mkdir -p "$OUT"
          if [ -f "dist/eDIN-Plus-Gateway-Control-${VERSION}.exe" ]; then
            cp "dist/eDIN-Plus-Gateway-Control-${VERSION}.exe" "$OUT/"
          else
            cp dist/*.exe "$OUT/eDIN-Plus-Gateway-Control-${VERSION}.exe"
          fi
          (cd dist && zip -qry "../$OUT/eDIN-Plus-Gateway-Control-${VERSION}-win-x64.zip" win-unpacked)
          (cd dist && zip -qry "../$OUT/eDIN-Plus-Gateway-Control-${VERSION}-linux-x64.zip" linux-unpacked)
          git archive --format=zip --prefix="eDinPlusGateway-${VERSION}/" \
            -o "$OUT/eDIN-Plus-Gateway-Control-${VERSION}-source.zip" "$GITHUB_REF_NAME"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)
          ls -lh "$OUT"

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "# eDIN+ Gateway Control ${VERSION}"
            echo
            echo "## Download"
            echo "- **Windows:** [eDIN-Plus-Gateway-Control-${VERSION}.exe](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/eDIN-Plus-Gateway-Control-${VERSION}.exe) — portable app, no install required"
            echo "- Windows zip (unpacked folder)"
            echo "- Linux zip"
            echo "- Source zip"
            echo "- \`SHA256SUMS.txt\`"
            echo
            node scripts/changelog-notes.js "$VERSION"
          } > /tmp/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            release-assets/eDIN-Plus-Gateway-Control-*.exe
            release-assets/eDIN-Plus-Gateway-Control-*-win-x64.zip
            release-assets/eDIN-Plus-Gateway-Control-*-linux-x64.zip
            release-assets/eDIN-Plus-Gateway-Control-*-source.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
